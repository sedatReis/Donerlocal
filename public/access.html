<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sark Kebab - Bestellung</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body.page--access-fullscreen {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(900px 520px at 8% -2%, rgba(240,179,33,.26), transparent 58%),
        radial-gradient(700px 520px at 98% 15%, rgba(214,40,31,.13), transparent 60%),
        linear-gradient(180deg, #f7ecd8 0%, #efe1c8 52%, #ead8bb 100%);
      color: #1e130a;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    .langDropdown {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
    }

    .langDropdown__toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 14px;
      border: 2px solid rgba(112,77,45,.12);
      background: rgba(255,255,255,.75);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      color: #2b170b;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .langDropdown__toggle:hover {
      border-color: rgba(214,40,31,.25);
      background: rgba(255,255,255,.9);
    }

    .langDropdown__toggle svg {
      flex-shrink: 0;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .langDropdown__arrow {
      font-size: 12px;
      margin-left: 2px;
      transition: transform .2s;
    }

    .langDropdown.is-open .langDropdown__arrow {
      transform: rotate(180deg);
    }

    .langDropdown__list {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 100%;
      background: rgba(255,255,255,.95);
      border: 2px solid rgba(112,77,45,.12);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(77,45,18,.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .langDropdown__item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      color: #2b170b;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .langDropdown__item:hover {
      background: rgba(214,40,31,.08);
    }

    .langDropdown__item svg {
      flex-shrink: 0;
      border-radius: 3px;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
    }

    .accessFullscreen {
      width: 100%;
      max-width: 600px;
      padding: 40px 28px;
      text-align: center;
    }

    .accessFullscreen__logoImg {
      width: min(550px, 90vw);
      max-height: 40vh;
      height: auto;
      object-fit: contain;
      margin-bottom: 28px;
    }

    .accessFullscreen__subtitle {
      font-size: 16px;
      color: #735f45;
      margin-bottom: 48px;
    }

    .accessFullscreen__question {
      font-size: 28px;
      font-weight: 900;
      color: #2b170b;
      margin-bottom: 24px;
    }

    .accessFullscreen__input {
      width: 100%;
      padding: 18px 20px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      border-radius: 20px;
      border: 2px solid rgba(112,77,45,.18);
      background: rgba(255,255,255,.85);
      color: #1e130a;
      outline: none;
      box-shadow: 0 8px 24px rgba(77,45,18,.08);
    }

    .accessFullscreen__input:focus {
      border-color: rgba(214,40,31,.4);
      box-shadow: 0 8px 24px rgba(214,40,31,.12);
    }

    .accessFullscreen__input::placeholder {
      color: #b5a48e;
      font-weight: 500;
    }

    .accessFullscreen__hint {
      margin-top: 12px;
      font-size: 14px;
      color: #8b7a65;
    }

    .accessFullscreen__error {
      min-height: 24px;
      margin-top: 12px;
      color: #b4232b;
      font-weight: 700;
      font-size: 15px;
    }

    .accessFullscreen__btn {
      margin-top: 24px;
      width: 100%;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: 800;
      border: none;
      border-radius: 20px;
      color: #fff7ef;
      background: linear-gradient(135deg, #d6281f, #f04f26 70%, #f0b321);
      box-shadow: 0 10px 24px rgba(214,40,31,.22);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .accessFullscreen__btn:hover {
      background: linear-gradient(135deg, #cc231b, #ea4a23 70%, #eead12);
    }

    .accessFullscreen__btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="page--access-fullscreen">

  <!-- Language selector (dropdown) -->
  <div class="langDropdown" id="langDropdown">
    <button class="langDropdown__toggle" id="langToggle" type="button">
      <span id="langCurrentFlag"></span>
      <span id="langCurrentLabel"></span>
      <span class="langDropdown__arrow">▾</span>
    </button>
    <div class="langDropdown__list hidden" id="langList">
      <button class="langDropdown__item" data-lang="de">
        <svg width="24" height="16" viewBox="0 0 24 16"><rect width="24" height="5.33" fill="#ed2939"/><rect y="5.33" width="24" height="5.34" fill="#fff"/><rect y="10.67" width="24" height="5.33" fill="#ed2939"/></svg>
        DE
      </button>
      <button class="langDropdown__item" data-lang="en">
        <svg width="24" height="16" viewBox="0 0 24 16"><rect width="24" height="16" fill="#012169"/><path d="M0 0l24 16M24 0L0 16" stroke="#fff" stroke-width="2.5"/><path d="M0 0l24 16M24 0L0 16" stroke="#C8102E" stroke-width="1.5"/><path d="M12 0v16M0 8h24" stroke="#fff" stroke-width="4"/><path d="M12 0v16M0 8h24" stroke="#C8102E" stroke-width="2.5"/></svg>
        EN
      </button>
      <button class="langDropdown__item" data-lang="tr">
        <svg width="24" height="16" viewBox="0 0 24 16"><rect width="24" height="16" fill="#E30A17"/><circle cx="10" cy="8" r="4.5" fill="#fff"/><circle cx="11.2" cy="8" r="3.6" fill="#E30A17"/><polygon points="14,8 14.8,6.5 13.2,7.4 15,7.4 13.4,6.5" fill="#fff"/></svg>
        TR
      </button>
    </div>
  </div>

  <div class="accessFullscreen">
    <img src="/imagesforsark/Logofuerstartseite.png" alt="Sark Kebab" class="accessFullscreen__logoImg" />
    <div class="accessFullscreen__subtitle">Self-Order Kiosk</div>

    <form id="nameForm">
      <div class="accessFullscreen__question" data-i18n="nameQuestion">Wie ist dein Name?</div>
      <input
        id="nameInput"
        class="accessFullscreen__input"
        type="text"
        autocomplete="given-name"
        data-i18n-placeholder="namePlaceholder"
        placeholder="z.B. Sark"
        maxlength="50"
        autofocus
      />
      <div class="accessFullscreen__hint" data-i18n="nameHint">Dein Name wird auf dem Bestellbon gedruckt.</div>
      <div id="errorBox" class="accessFullscreen__error"></div>
      <button id="submitBtn" type="submit" class="accessFullscreen__btn" data-i18n="nameSubmit">Weiter zur Speisekarte</button>
    </form>
  </div>

  <!-- Dine screen (after name entry) -->
  <div id="dineScreenAccess" class="fullscreenOverlay hidden">
    <div class="fullscreenOverlay__content">
      <img src="/imagesforsark/Logofuerstartseite.png" alt="Sark Kebab" class="accessFullscreen__logoImg" />
      <div class="fullscreenOverlay__title" data-i18n="dineQuestion">Wo möchtest du essen?</div>
      <div class="fullscreenOverlay__choices">
        <button class="fullscreenChoice" data-dine="hieressen">
          <svg class="fullscreenChoice__icon" viewBox="0 0 80 80" width="80" height="80">
            <ellipse cx="40" cy="62" rx="34" ry="6" fill="#b08860" opacity=".3"/>
            <rect x="8" y="52" width="64" height="5" rx="2.5" fill="#a0825e"/>
            <rect x="6" y="50" width="68" height="4" rx="2" fill="#c8a87a"/>
            <ellipse cx="30" cy="46" rx="16" ry="5" fill="#f5f0e8" stroke="#d4c4a0" stroke-width=".8"/>
            <ellipse cx="30" cy="44" rx="12" ry="3.5" fill="#fff"/>
            <path d="M22 42c2-6 6-8 8-8s6 2 8 8" fill="#d4956a" stroke="#a06830" stroke-width=".6"/>
            <path d="M24 42c1-3 3-5 6-5s5 2 6 5" fill="#e8b888"/>
            <path d="M25 40h10" stroke="#5cb85c" stroke-width="1" stroke-linecap="round"/>
            <path d="M26 38h8" stroke="#e74c3c" stroke-width=".8" stroke-linecap="round"/>
            <rect x="54" y="28" width="14" height="22" rx="3" fill="#e74c3c" stroke="#b33a2e" stroke-width=".7"/>
            <rect x="56" y="24" width="10" height="5" rx="1.5" fill="#f5f5f5" stroke="#ccc" stroke-width=".5"/>
            <path d="M58 34h8" stroke="#ffcdd2" stroke-width=".6"/>
            <path d="M58 38h8" stroke="#ffcdd2" stroke-width=".6"/>
            <rect x="63" y="18" width="1.5" height="14" rx=".75" fill="#fdd835"/>
          </svg>
          <span class="fullscreenChoice__label" data-i18n="dineHere">Hier essen</span>
        </button>
        <button class="fullscreenChoice" data-dine="mitnehmen">
          <svg class="fullscreenChoice__icon" viewBox="0 0 80 80" width="80" height="80">
            <path d="M20 25h40l-4 35H24z" fill="#c8956a" stroke="#8b6b4a" stroke-width="2"/>
            <path d="M20 25l4-10h32l4 10" fill="#d4a87a" stroke="#8b6b4a" stroke-width="1.5"/>
            <path d="M30 18v-6a10 10 0 0120 0v6" fill="none" stroke="#8b6b4a" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M28 35h24M28 42h24M28 49h24" stroke="#fff" stroke-width="1" opacity=".4"/>
          </svg>
          <span class="fullscreenChoice__label" data-i18n="dineTakeaway">Mitnehmen</span>
        </button>
      </div>
    </div>
  </div>

  <script src="/access.js?v=8"></script>
</body>
</html>
